name: Testes

# Acionamento manual por enquanto: em repositório privado o GitHub Actions consome minutos.
# Para rodar a cada push e pull request, acrescente `push:` e `pull_request:` abaixo de `on:`.
on:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r _DESIGN_SYSTEM/requirements.txt pytest pyyaml pdfplumber pypdfium2
      - run: python -m pytest -q -p no:cacheprovider _DESIGN_SYSTEM/tests _TESTS
      - run: python _TOOLS/sync_shared.py --check
      - run: python _TOOLS/build_sources.py --check
