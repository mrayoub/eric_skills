name: Testes

# Em todo push e pull request: versionamento e canais (rápido) e a suíte em Linux/Python 3.12.
# Matriz completa (Windows, macOS e Linux x Python 3.10 e 3.12) só toda segunda e sob demanda:
# em repositório privado o GitHub Actions consome minutos (macOS conta 10x, Windows 2x).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  versionamento:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _TESTS/requirements-lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.20.0"
      - run: python -m pip install -r _TESTS/requirements-dev.txt
      - run: python _TOOLS/sync_shared.py --check
      - run: python _TOOLS/build_sources.py --check
      - name: Versão de cada skill em dia com o conteúdo
        run: |
          python _TOOLS/build_catalog.py --check || {
            echo "::error::O conteúdo de alguma skill mudou sem subir a versão. Rode: python _TOOLS/build_catalog.py --bump"
            exit 1
          }
      - name: Canais npx, .skill e clone
        run: python _TOOLS/check_channels.py
      - name: Pacotes versionados iguais às fontes
        run: python _TOOLS/build_dist.py --check

  testes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _TESTS/requirements-lock.txt
      - name: Instalar conversores para comparar DOCX e PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
      - run: python -m pip install -r _TESTS/requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider _DESIGN_SYSTEM/tests _TESTS

  matriz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: _TESTS/requirements-lock.txt
      - run: python -m pip install -r _TESTS/requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider _DESIGN_SYSTEM/tests _TESTS
      - run: python _TOOLS/sync_shared.py --check
      - run: python _TOOLS/build_sources.py --check
      - run: python _TOOLS/build_catalog.py --check
