name: Publicar pacotes

# Publica somente o commit do main que concluiu o workflow Testes com sucesso.
on:
  workflow_run:
    workflows: [Testes]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Confirmar commit atual e mudança no catálogo
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Commit antigo; publicação ignorada."
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || ! git diff --quiet HEAD^ HEAD -- catalog.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.changes.outputs.publish == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _TESTS/requirements-lock.txt
      - if: steps.changes.outputs.publish == 'true'
        run: python -m pip install -r _TESTS/requirements-dev.txt
      - if: steps.changes.outputs.publish == 'true'
        run: python _TOOLS/build_catalog.py --check
      - if: steps.changes.outputs.publish == 'true'
        run: python _TOOLS/build_dist.py
      - if: steps.changes.outputs.publish == 'true'
        run: python _TOOLS/publish_releases.py
        env:
          GH_TOKEN: ${{ github.token }}
